# Project identification
# Replace the projet key and name with your project name
sonar.projectKey=expo-starter-kit
sonar.projectName=expo-starter-kit

# Sources
sonar.sources=src
sonar.tests=__tests__

# Source file inclusions
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# Test file inclusions
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/types/*.ts,**/constants/*.ts,src/store/utils/*.ts,src/exceptions/*.ts,src/store/types/*.ts

# General exclusions
sonar.exclusions=node_modules/**/*,android/**/*,ios/**/*,__mocks__/**/*,.husky/**/*,.vscode/**/*,.yarn/**/*,vendor/**/*,**/__snapshots__/**/*,index.js,**/*.json,coverage/**/*, \
                 .expo/**/*,.expo-shared/**/*,web-build/**/*,**/__tests__/**/*,**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts, \
                 babel.config.js,metro.config.js,app.config.js,eas.json

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding of source files
sonar.sourceEncoding=UTF-8

# Authentication (For Local SonaruQube)
# sonar.login=add_the_generated_token_from_your_local_sonarqube_here
# sonar.host.url=http://localhost:9000
